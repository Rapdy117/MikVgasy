#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related counter accept comment "Connexions etablies"
        ct state invalid counter drop comment "Paquets invalides"
        iifname "lo" counter accept comment "Boucle locale"

        ip protocol icmp limit rate 20/second burst 40 packets counter accept comment "ICMP IPv4 limite"
        ip6 nexthdr ipv6-icmp limit rate 20/second burst 40 packets counter accept comment "ICMPv6 essentiel limite"

        ip saddr 10.10.10.110 tcp dport 22 counter accept comment "SSH poste administration Dell"
        ip saddr 10.10.10.110 tcp dport 443 counter accept comment "HTTPS administration Dell"

        ip saddr 10.10.10.0/23 tcp dport 80 counter accept comment "Portail Hotspot et application HTTP LAN"

        ip saddr 10.10.10.1 udp dport { 1812, 1813 } counter accept comment "RADIUS CHR MikroTik"

        limit rate 5/second burst 10 packets counter log prefix "RM-NFT-DROP " level info
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
